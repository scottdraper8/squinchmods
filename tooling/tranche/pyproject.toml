[project]
name = "squinch-tranche"
version = "0.1.0"
description = "Repository-wide task scratch ownership and cleanup"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squinch_tranche"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
