schema_version = 1
name = "FTF C2ME density-function compiler generated default — NeoForge"
project = "games/minecraft/investigation-state/worktrees/ftf-c2me-dfc-compatibility"
loader = "neoforge"
seed = 3216933670
retention = "keep-on-failure"
