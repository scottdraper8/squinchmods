schema_version = 1
name = "RTF underground biome distribution"
project = "games/minecraft/mods/FreeTerraForged"
loader = "fabric"
seed = 3216933670
probe_packs = ["games/minecraft/investigations/reterraforged/probes/underground-biome-distribution"]
retention = "keep"

[rtf_ephemeral]
id = "underground-default-density-control"
purpose = "Measure underground biome ownership with the compiled-default ocean depth"
base_fixture = "games/minecraft/investigations/reterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
base_preset_sha256 = "70a6f61eab1640ac4b65f102b8d08efbec79a42b4f6542fae17dfdf0ff7e3487"
patch_file = "games/minecraft/investigations/reterraforged/patches/compiled-default-ocean-depth.json"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 600
shutdown = 120

[expectations]
required_mods = ["minecraft", "reterraforged"]

[[probes]]
id = "squinch:rtf-underground-biome-distribution"
version = "1"
config = { bounds = [0, 0, 0, 0], unit = "chunk", max_wait_ticks = 1200, sample_min_x = -32768, sample_max_x = 32768, sample_min_z = -32768, sample_max_z = 32768, horizontal_step_blocks = 512, sample_min_y = -64, sample_max_y = 63, vertical_step_blocks = 4, bands = [
  { id = "lower", min_y = -64, max_y = -1 },
  { id = "middle", min_y = 0, max_y = 31 },
  { id = "upper", min_y = 32, max_y = 63 },
] }

[[steps]]
id = "broad-direct-census"
type = "generate"
unit = "chunk"
bounds = [0, 0, 0, 0]
authority = "finished-chunk"
terminal_probe = "squinch:rtf-underground-biome-distribution"
expect = { region_count = 1, terminal_state = "pass" }
