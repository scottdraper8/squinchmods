schema_version = 1
name = "Upstream FTF with current Lithostitched and Regions Unexplored Fabric control"
project = "games/minecraft/mods/FreeTerraForged"
loader = "fabric"
launch_task = "runServer"
seed = 3216933670
ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
companion_artifacts = [
    "mc1.21.1-fabric-fabric-api-0.116.17+1.21.1",
    "mc1.21.1-fabric-lithostitched-1.8.0-beta6",
    "mc1.21.1-fabric-regions-unexplored-0.6.2-lithostitched-beta6",
]
retention = "keep-on-failure"

[server_properties]
view-distance = 4
simulation-distance = 4
