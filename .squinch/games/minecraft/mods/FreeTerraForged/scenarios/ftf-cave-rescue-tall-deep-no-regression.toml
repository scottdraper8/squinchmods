schema_version = 1
name = "FTF surface-rescue tall/deep-world no-regression check"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 3216933670
retention = "discard"
probe_packs = ["games/minecraft/investigations/freeterraforged/probes/surface-rescue-crash"]

ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/maximum-vertical-range-cave-decoration-stress/fixture.toml"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 300
shutdown = 60

[expectations]
required_mods = ["minecraft", "freeterraforged"]

[[probes]]
id = "squinch:finished-chunks"
version = "1"
config = { max_wait_ticks = 1200 }

[[probes]]
id = "squinch:ftf-surface-rescue-crash"
version = "1"
config = { feature_id = "minecraft:cave_vines", pos = [8, 100, 8], attempts = 5 }

[[steps]]
id = "generate-spawn-chunk"
type = "generate"
unit = "chunk"
bounds = [0, 0, 0, 0]
authority = "finished-chunk"
terminal_probe = "squinch:finished-chunks"
expect = { terminal_state = "pass" }

[[steps]]
id = "trigger-surface-rescue"
type = "probe"
probe = "squinch:ftf-surface-rescue-crash"
expect = { terminal_state = "pass" }
