schema_version = 1
name = "RTF PR 202 InSquare/cave-rescue interaction — Nature's Spirit"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 3216933670
rtf_fixture = "games/minecraft/investigations/reterraforged/fixtures/maximum-vertical-range-cave-decoration-stress/fixture.toml"
probe_packs = [
    "games/minecraft/investigations/reterraforged/probes/in-square-cave-interaction",
    "games/minecraft/investigations/reterraforged/probes/underground-feature-enclosure",
    "games/minecraft/investigations/reterraforged/probes/placement-telemetry",
]
companion_artifacts = [
    "mc1.21.1-fabric-terrablender-4.1.0.8",
    "mc1.21.1-fabric-glitchcore-2.1.0.2",
    "mc1.21.1-fabric-natures-spirit-2.2.5",
]
retention = "keep"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 900
shutdown = 120

[expectations]
required_mods = ["minecraft", "reterraforged", "terrablender", "natures_spirit"]

[[probes]]
id = "squinch:rtf-in-square-cave-interaction"
version = "1"
config = { feature_ids = ["minecraft:rooted_azalea_tree", "minecraft:cave_vines", "minecraft:lush_caves_vegetation", "minecraft:lush_caves_clay", "minecraft:lush_caves_ceiling_vegetation", "minecraft:spore_blossom"], bounds = [80, 100, 83, 103], unit = "chunk", max_wait_ticks = 6000 }

[[probes]]
id = "squinch:rtf-underground-feature-enclosure"
version = "1"
config = { bounds = [80, 100, 83, 103], unit = "chunk", max_wait_ticks = 6000, require_actual_checks = false }

[[probes]]
id = "squinch:rtf-placement-telemetry"
version = "1"
config = { feature_ids = ["minecraft:rooted_azalea_tree", "minecraft:cave_vines", "minecraft:lush_caves_vegetation", "minecraft:lush_caves_clay", "minecraft:lush_caves_ceiling_vegetation", "minecraft:spore_blossom"], bounds = [80, 100, 83, 103], unit = "chunk", max_wait_ticks = 6000, top_k = 30, bands = [{ id = "full_vertical_range", min_y = -1024, max_y = 1023 }] }

[[steps]]
id = "generate-cave-window"
type = "generate"
unit = "chunk"
bounds = [80, 100, 83, 103]
authority = "finished-chunk"
terminal_probe = "squinch:rtf-in-square-cave-interaction"
expect = { terminal_state = "pass" }

[[steps]]
id = "measure-enclosure"
type = "probe"
probe = "squinch:rtf-underground-feature-enclosure"
expect = { terminal_state = "pass" }

[[steps]]
id = "measure-placement-outcomes"
type = "probe"
probe = "squinch:rtf-placement-telemetry"
expect = { terminal_state = "pass" }
