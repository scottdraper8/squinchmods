schema_version = 1
name = "Final packaged FTF Fabric startup without TerraBlender"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
launch_task = "prodServer"
seed = 3216933670
ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
probe_packs = [
    "games/minecraft/investigations/freeterraforged/probes/biome-preview-parity",
    "games/minecraft/investigations/freeterraforged/probes/flow-settings-acceptance",
]
companion_artifacts = ["mc1.21.1-fabric-fabric-api-0.116.17+1.21.1"]
retention = "keep-on-failure"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 600
shutdown = 120

[expectations]
required_mods = ["minecraft", "freeterraforged"]

[[probes]]
id = "squinch:ftf-flow-settings-acceptance"
version = "1"
config = { expected_overworld_settings = 7 }

[[probes]]
id = "squinch:ftf-biome-preview-parity"
version = "1"
config = { bounds = [64, 64, 67, 67], unit = "chunk", max_wait_ticks = 2400, horizontal_quart_step = 1, example_limit = 32, use_tile_authority = true }

[[steps]]
id = "capture-flow-settings-before-reload"
type = "probe"
probe = "squinch:ftf-flow-settings-acceptance"
expect = { terminal_state = "pass" }

[[steps]]
id = "reload-packaged-server"
type = "command"
command = "reload"

[[steps]]
id = "verify-packaged-flow-settings-sync"
type = "probe"
probe = "squinch:ftf-flow-settings-acceptance"
expect = { terminal_state = "pass" }

[[steps]]
id = "compare-preview-to-finished-chunks"
type = "generate"
unit = "chunk"
bounds = [64, 64, 67, 67]
authority = "finished-chunk"
terminal_probe = "squinch:ftf-biome-preview-parity"
expect = { terminal_state = "pass" }
