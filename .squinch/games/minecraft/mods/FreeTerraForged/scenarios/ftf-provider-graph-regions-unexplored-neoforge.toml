schema_version = 1
name = "FTF provider graph — Regions Unexplored + current Lithostitched NeoForge"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "neoforge"
seed = 3216933670
rtf_fixture = "games/minecraft/investigations/reterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
probe_packs = ["games/minecraft/investigations/reterraforged/probes/reachability-census", "games/minecraft/investigations/reterraforged/probes/feature-graph-census"]
