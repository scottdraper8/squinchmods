schema_version = 1
name = "FTF C2ME DFC comparison control (neoforge, C2ME absent)"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "neoforge"
launch_task = "prodServer"
seed = -1078033626
ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
probe_packs = ["games/minecraft/investigations/freeterraforged/probes/biome-preview-parity", "games/minecraft/investigations/freeterraforged/probes/cell-cache"]
retention = "keep"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 600
shutdown = 120

[expectations]
required_mods = ["minecraft", "freeterraforged"]

[[probes]]
id = "squinch:ftf-cell-sampler-fallback-parity"
version = "1"
config = { coordinates = [[262146, 262146], [262150, 262154], [-262142, 262150]] }

[[probes]]
id = "squinch:ftf-biome-preview-parity"
version = "1"
config = { bounds = [64, 64, 67, 67], unit = "chunk", max_wait_ticks = 2400, horizontal_quart_step = 1, example_limit = 32, use_tile_authority = true }

[[steps]]
id = "compare-uncached-climate-fields"
type = "probe"
probe = "squinch:ftf-cell-sampler-fallback-parity"
expect = { terminal_state = "pass" }

[[steps]]
id = "compare-preview-to-finished-chunks"
type = "generate"
unit = "chunk"
bounds = [64, 64, 67, 67]
authority = "finished-chunk"
terminal_probe = "squinch:ftf-biome-preview-parity"
expect = { terminal_state = "pass" }
