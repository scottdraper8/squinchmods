schema_version = 1
name = "FTF + TerraBlender/Biolith/Terrestria biome preview parity"
project = "games/minecraft/mods/FreeTerraForged"
loader = "fabric"
seed = 3216933670
probe_packs = ["games/minecraft/investigations/reterraforged/probes/biome-preview-parity"]
companion_artifacts = [
    "mc1.21.1-fabric-terrablender-4.1.0.8",
    "mc1.21.1-fabric-biolith-3.0.14",
    "mc1.21.1-fabric-terrestria-7.0.3",
]
retention = "keep"

[rtf_ephemeral]
id = "biome-preview-parity-mixed-900-50"
purpose = "Preview parity at a deterministic Terrestria biome location"
base_fixture = "games/minecraft/investigations/reterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
base_preset_sha256 = "70a6f61eab1640ac4b65f102b8d08efbec79a42b4f6542fae17dfdf0ff7e3487"
patch_file = "games/minecraft/investigations/reterraforged/patches/biome-size-900-underground-50.json"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 900
shutdown = 120

[expectations]
required_mods = ["minecraft", "reterraforged", "terrablender", "biolith", "terrestria"]

[[probes]]
id = "squinch:rtf-biome-preview-parity"
version = "1"
config = { bounds = [-94, 131, -90, 135], unit = "chunk", max_wait_ticks = 6000, horizontal_quart_step = 1, example_limit = 32 }

[[steps]]
id = "locate-terrestria"
type = "command"
command = "locate biome terrestria:japanese_maple_forest"

[[steps]]
id = "compare-preview-to-finished-chunks"
type = "generate"
unit = "chunk"
bounds = [-94, 131, -90, 135]
authority = "finished-chunk"
terminal_probe = "squinch:rtf-biome-preview-parity"
expect = { terminal_state = "pass" }
