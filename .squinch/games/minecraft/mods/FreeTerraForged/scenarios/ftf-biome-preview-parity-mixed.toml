schema_version = 1
name = "FTF + TerraBlender/Biolith/Terrestria biome preview parity"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 3216933670
probe_packs = ["games/minecraft/investigations/freeterraforged/probes/biome-preview-parity"]
companion_artifacts = [
    "mc1.21.1-fabric-terrablender-4.1.0.8",
    "mc1.21.1-fabric-biolith-3.0.14",
    "mc1.21.1-fabric-terrestria-7.0.3",
]
retention = "keep-on-failure"

ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/generated/vanilla-depth-maximum-ocean--biome-size-900-underground-50/fixture.toml"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 900
shutdown = 120

[expectations]
required_mods = ["minecraft", "freeterraforged", "terrablender", "biolith", "terrestria"]

[[probes]]
id = "squinch:ftf-biome-preview-parity"
version = "1"
config = { bounds = [16, 275, 20, 279], unit = "chunk", max_wait_ticks = 6000, horizontal_quart_step = 1, example_limit = 32 }

[[steps]]
id = "locate-terrestria"
type = "command"
command = "locate biome terrestria:japanese_maple_forest"

[[steps]]
id = "compare-preview-to-finished-chunks"
type = "generate"
unit = "chunk"
bounds = [16, 275, 20, 279]
authority = "finished-chunk"
terminal_probe = "squinch:ftf-biome-preview-parity"
expect = { terminal_state = "pass" }
