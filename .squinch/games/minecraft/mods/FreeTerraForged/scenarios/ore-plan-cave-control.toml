schema_version = 1
name = "Ore plan verification: non-ocean cave-heavy vertical control"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 12345
ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/maximum-vertical-range-cave-decoration-stress/fixture.toml"
probe_packs = ["games/minecraft/investigations/freeterraforged/probes/placement-telemetry"]
retention = "keep-on-failure"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 600
shutdown = 60

[expectations]
required_mods = ["minecraft", "freeterraforged"]

[[probes]]
id = "squinch:ftf-placement-telemetry"
version = "1"
config = { feature_ids = ["minecraft:ore_coal_upper", "minecraft:ore_iron_small", "minecraft:ore_diamond", "minecraft:ore_redstone"], bounds = [226, -414, 233, -407], unit = "chunk", max_wait_ticks = 1200, top_k = 20, bands = [{ id = "full_vertical_range", min_y = -1024, max_y = 1023 }] }

[[probes]]
id = "squinch:finished-chunk-palette"
version = "1"
config = { bounds = [226, -414, 233, -407], unit = "chunk", sample_heightmap = "WORLD_SURFACE", sample_step = 4, top_k = 20, example_limit = 20 }

[[steps]]
id = "generate-cave-window"
type = "generate"
unit = "chunk"
bounds = [226, -414, 233, -407]
authority = "finished-chunk"
terminal_probe = "squinch:ftf-placement-telemetry"
expect = { terminal_state = "pass" }

[[steps]]
id = "verify-finished-surface"
type = "probe"
probe = "squinch:finished-chunk-palette"
expect = { terminal_state = "pass" }
