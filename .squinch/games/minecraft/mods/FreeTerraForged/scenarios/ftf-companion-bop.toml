schema_version = 1
name = "FTF + Biomes O' Plenty composition audit"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 3216933670
rtf_fixture = "games/minecraft/investigations/reterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
probe_packs = ["games/minecraft/investigations/reterraforged/probes/reachability-census"]
companion_artifacts = [
    "mc1.21.1-fabric-terrablender-4.1.0.8",
    "mc1.21.1-fabric-glitchcore-2.1.0.2",
    "mc1.21.1-fabric-biomes-o-plenty-21.1.0.14",
]
retention = "keep-on-failure"

[server_properties]
view-distance = 4
simulation-distance = 4

[timeouts]
