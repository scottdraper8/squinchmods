schema_version = 1
name = "FTF + Terrestria lifecycle — owner-preserving Fabric tag reload"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
launch_task = "prodServer"
seed = 3216933670
rtf_fixture = "games/minecraft/investigations/reterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
probe_packs = ["games/minecraft/investigations/reterraforged/probes/worldgen-lifecycle"]
companion_artifacts = [
    "mc1.21.1-fabric-fabric-api-0.116.15+1.21.1",
    "mc1.21.1-fabric-terrablender-4.1.0.8",
    "mc1.21.1-fabric-biolith-3.0.14",
    "mc1.21.1-fabric-terrestria-7.0.3",
]
retention = "keep"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 600
step = 1200
shutdown = 120

[expectations]
required_mods = ["minecraft", "reterraforged", "biolith", "terrestria"]

[[probes]]
id = "squinch:ftf-worldgen-lifecycle"
version = "1"
config = { max_wait_ticks = 24000 }

[[probes]]
id = "squinch:finished-chunks"
version = "1"
config = { max_wait_ticks = 24000 }

[[steps]]
id = "capture-worldgen-epoch"
type = "probe"
probe = "squinch:ftf-worldgen-lifecycle"
expect = { terminal_state = "pass" }

[[steps]]
id = "remove-tag-bearing-resource-layer"
type = "command"
command = "datapack disable \"file/vanilla-depth-maximum-ocean.zip\""

[[steps]]
id = "verify-atomic-plan-rebind"
type = "probe"
probe = "squinch:ftf-worldgen-lifecycle"
expect = { terminal_state = "pass" }

[[steps]]
id = "generate-after-rebind"
type = "generate"
unit = "chunk"
bounds = [96, 96, 97, 97]
authority = "finished-chunk"
terminal_probe = "squinch:finished-chunks"
expect = { region_count = 1, terminal_state = "pass" }
