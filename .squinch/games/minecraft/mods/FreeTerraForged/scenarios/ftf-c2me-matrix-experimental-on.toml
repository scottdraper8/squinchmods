schema_version = 1
name = "FTF experimentalChunkFixes 8591d2b — C2ME with DFC explicitly enabled packaged generation benchmark — Fabric"
project = "games/minecraft/investigations/vanilla-control"
loader = "fabric"
launch_task = "prodServer"
subject_artifact = "games/minecraft/investigation-state/worktrees/ftf-experimental-chunk-fixes/fabric/build/libs/reterraforged-0.0.6005-fabric-1.21.1.jar"
subject_compile_artifact = "games/minecraft/investigation-state/worktrees/ftf-experimental-chunk-fixes/fabric/build/libs/reterraforged-0.0.6005-dev-shadow.jar"
seed = 3216933670
retention = "keep-on-failure"
companion_artifacts = [
  "mc1.21.1-fabric-c2me-0.4.0-alpha.0.27+1.21.1",
  "mc1.21.1-fabric-fabric-api-0.116.17+1.21.1",
]
datapacks = [
  "games/minecraft/investigations/reterraforged/fixtures/modern-default-with-rivers-live-export/reterraforged-preset.zip",
]

[[runtime_files]]
source = "games/minecraft/investigations/reterraforged/inputs/c2me-dfc-true.toml"
target = "config/c2me.toml"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 600
step = 1800
shutdown = 240

[expectations]
required_mods = ["minecraft", "reterraforged", "c2me"]

[[probes]]
id = "squinch:finished-chunks"
version = "1"
config = { max_wait_ticks = 24000 }

[[steps]]
id = "warm-up"
type = "generate"
unit = "chunk"
bounds = [-64, -64, -44, -44]
authority = "finished-chunk"
terminal_probe = "squinch:finished-chunks"
release_after_observation = true
expect = { terminal_state = "pass" }

[[steps]]
id = "benchmark-fresh-windows"
type = "generate"
unit = "chunk"
bounds = [16, -76, 36, -56]
repeat = 7
offset = [32, 0]
release_after_observation = true
authority = "finished-chunk"
terminal_probe = "squinch:finished-chunks"
expect = { terminal_state = "pass" }
