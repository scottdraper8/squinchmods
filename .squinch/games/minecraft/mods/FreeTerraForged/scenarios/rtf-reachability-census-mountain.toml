schema_version = 1
name = "RTF biome reachability census — shallow-depth mountain"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 12345
rtf_fixture = "games/minecraft/investigations/reterraforged/fixtures/shallow-depth-mountain-control/fixture.toml"
probe_packs = ["games/minecraft/investigations/reterraforged/probes/reachability-census"]
retention = "keep"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 900
shutdown = 120

[expectations]
required_mods = ["minecraft", "reterraforged"]

[[probes]]
id = "squinch:rtf-reachability-census"
version = "1"
config = { bounds = [354, 354, 414, 414], unit = "chunk", max_wait_ticks = 6000, horizontal_quart_step = 1, vertical_quart_step = 2, surface_threshold_y = 62 }

[[steps]]
id = "generate-census-mountain"
type = "generate"
unit = "chunk"
bounds = [354, 354, 414, 414]
authority = "finished-chunk"
terminal_probe = "squinch:rtf-reachability-census"
expect = { terminal_state = "pass" }
