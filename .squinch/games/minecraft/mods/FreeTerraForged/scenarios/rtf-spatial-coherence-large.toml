[[probes]]
id = "squinch:rtf-spatial-coherence"
version = "1"
config = { bounds = [75, 95, 85, 105], unit = "chunk", max_wait_ticks = 2400, scan_line_count = 16, vertical_column_count = 40, surface_y = 72, min_y = -64, max_y = 256 }

[[probes]]
id = "squinch:rtf-biome-palette"
version = "1"
config = { bounds = [75, 95, 85, 105], unit = "chunk", max_wait_ticks = 2400, min_y = -64, max_y = 319, horizontal_quart_step = 1, vertical_quart_step = 1, top_k = 40, example_limit = 12, include_climate_axes = true, bands = [
  { id = "deep-cave", min_y = -64, max_y = -33 },
  { id = "shallow-underground", min_y = -32, max_y = 48 },
  { id = "surface", min_y = 49, max_y = 128 },
  { id = "mountain", min_y = 129, max_y = 256 },
  { id = "high-air", min_y = 257, max_y = 319 },
] }

[[steps]]
