schema_version = 1
name = "FTF trail ruins enclosure scan (modern-default-with-rivers-live-export)"
project = "games/minecraft/investigation-state/worktrees/ftf-trail-ruins"
loader = "fabric"
seed = 3216933670
retention = "keep-on-failure"

datapacks = [
  "games/minecraft/investigations/reterraforged/fixtures/modern-default-with-rivers-live-export/reterraforged-preset.zip",
]
probe_packs = ["games/minecraft/investigations/reterraforged/probes/trail-ruins-enclosure"]

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 600
step = 600
shutdown = 180

[expectations]
required_mods = ["minecraft", "reterraforged"]

[[probes]]
id = "squinch:rtf-trail-ruins-enclosure"
version = "1"
config = { structure_id = "minecraft:trail_ruins", shell_example_limit = 40, max_shell_samples = 200000 }

