schema_version = 1
name = "RTF spatial coherence + biome palette + climate domain validation"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 3216933670
rtf_fixture = "games/minecraft/investigations/reterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
probe_packs = [
  "games/minecraft/investigations/reterraforged/probes/spatial-coherence",
  "games/minecraft/investigations/reterraforged/probes/biome-palette",
  "games/minecraft/investigations/reterraforged/probes/climate-domain",
]
retention = "keep"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 900
shutdown = 120

[expectations]
required_mods = ["minecraft", "reterraforged"]

[[probes]]
id = "squinch:rtf-spatial-coherence"
version = "1"
config = { bounds = [80, 100, 80, 100], unit = "chunk", max_wait_ticks = 1200, scan_line_count = 12, vertical_column_count = 24, surface_y = 72, min_y = -64, max_y = 256 }

[[probes]]
id = "squinch:rtf-biome-palette"
version = "1"
config = { bounds = [80, 100, 80, 100], unit = "chunk", max_wait_ticks = 1200, min_y = -64, max_y = 319, horizontal_quart_step = 1, vertical_quart_step = 1, top_k = 40, example_limit = 12, include_climate_axes = true, bands = [
  { id = "deep-cave", min_y = -64, max_y = -33 },
  { id = "shallow-underground", min_y = -32, max_y = 48 },
  { id = "surface", min_y = 49, max_y = 128 },
  { id = "mountain", min_y = 129, max_y = 256 },
  { id = "high-air", min_y = 257, max_y = 319 },
] }

[[probes]]
id = "squinch:rtf-climate-domain"
version = "1"
config = { bounds = [0, 0, 2, 2], unit = "chunk", max_wait_ticks = 6000, sample_min_x = -10000, sample_max_x = 10000, sample_min_z = -10000, sample_max_z = 10000, sample_step_blocks = 4, surface_y = 62, convergence_radii = [500, 1000, 2500, 5000, 10000] }

[[steps]]
id = "generate-biome-window"
type = "generate"
unit = "chunk"
bounds = [80, 100, 80, 100]
authority = "finished-chunk"
terminal_probe = "squinch:rtf-spatial-coherence"
expect = { region_count = 1, terminal_state = "pass" }

[[steps]]
id = "biome-palette-scan"
type = "generate"
unit = "chunk"
bounds = [80, 100, 80, 100]
authority = "finished-chunk"
terminal_probe = "squinch:rtf-biome-palette"
expect = { region_count = 1, terminal_state = "pass" }

[[steps]]
id = "climate-domain-scan"
type = "generate"
unit = "chunk"
bounds = [0, 0, 2, 2]
authority = "finished-chunk"
terminal_probe = "squinch:rtf-climate-domain"
expect = { terminal_state = "pass" }
