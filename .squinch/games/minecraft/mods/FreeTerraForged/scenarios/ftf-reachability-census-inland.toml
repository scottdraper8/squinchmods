schema_version = 1
name = "FTF biome reachability census — shallow-depth inland"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 12345
ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/shallow-depth-mountain-control/fixture.toml"
probe_packs = ["games/minecraft/investigations/freeterraforged/probes/reachability-census"]
retention = "keep-on-failure"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 900
shutdown = 120

[expectations]
required_mods = ["minecraft", "freeterraforged"]

[[probes]]
id = "squinch:ftf-reachability-census"
version = "1"
config = { bounds = [-158, -222, -98, -162], unit = "chunk", max_wait_ticks = 6000, horizontal_quart_step = 1, vertical_quart_step = 2, surface_threshold_y = 62 }

[[steps]]
id = "generate-census-inland"
type = "generate"
unit = "chunk"
bounds = [-158, -222, -98, -162]
authority = "finished-chunk"
terminal_probe = "squinch:ftf-reachability-census"
expect = { terminal_state = "pass" }
