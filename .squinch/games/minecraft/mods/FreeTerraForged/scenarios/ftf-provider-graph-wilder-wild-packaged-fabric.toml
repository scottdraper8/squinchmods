schema_version = 1
name = "FTF packaged Fabric subject — Wilder Wild and FrozenLib full-domain graph"
project = "games/minecraft/investigations/vanilla-control"
loader = "fabric"
launch_task = "prodServer"
subject_artifact = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility/fabric/build/libs/freeterraforged-0.0.6005-fabric-1.21.1.jar"
subject_compile_artifact = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility/fabric/build/libs/freeterraforged-0.0.6005-dev-shadow.jar"
seed = 3216933670
ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
probe_packs = [
    "games/minecraft/investigations/freeterraforged/probes/reachability-census",
    "games/minecraft/investigations/freeterraforged/probes/feature-graph-census",
    "games/minecraft/investigations/freeterraforged/probes/worldgen-normalization-census",
]
companion_artifacts = [
    "mc1.21.1-fabric-fabric-api-0.116.17+1.21.1",
    "mc1.21.1-fabric-frozenlib-2.2.4",
    "mc1.21.1-fabric-wilder-wild-4.2.1",
]
retention = "keep-on-failure"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 600
step = 900
shutdown = 120

[expectations]
required_mods = ["minecraft", "freeterraforged", "frozenlib", "wilderwild"]

[[probes]]
id = "squinch:ftf-worldgen-normalization-census"
version = "1"
config = {}

[[probes]]
id = "squinch:ftf-feature-graph-census"
version = "1"
config = {}

[[probes]]
id = "squinch:ftf-composition-audit"
version = "1"
config = {}

[[steps]]
id = "census-normalizable-worldgen-graph"
type = "probe"
probe = "squinch:ftf-worldgen-normalization-census"
expect = { terminal_state = "pass" }

[[steps]]
id = "census-final-feature-graph"
type = "probe"
probe = "squinch:ftf-feature-graph-census"
expect = { terminal_state = "pass" }

[[steps]]
id = "audit-composition"
type = "generate"
unit = "chunk"
bounds = [0, 0, 0, 0]
authority = "finished-chunk"
terminal_probe = "squinch:ftf-composition-audit"
expect = { terminal_state = "pass" }
