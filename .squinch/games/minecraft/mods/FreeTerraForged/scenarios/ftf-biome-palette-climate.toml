schema_version = 1
name = "FTF finished-chunk biome palette with climate axes"
project = "games/minecraft/investigation-state/worktrees/ftf-worldgen-compatibility"
loader = "fabric"
seed = 3216933670
ftf_fixture = "games/minecraft/investigations/freeterraforged/fixtures/deep-world-ocean-stress/fixture.toml"
probe_packs = ["games/minecraft/investigations/freeterraforged/probes/biome-palette"]
