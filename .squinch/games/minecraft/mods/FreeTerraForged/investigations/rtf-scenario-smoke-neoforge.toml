schema_version = 1
name = "RTF NeoForge scenario runner smoke"
project = "../../../../../../games/minecraft/mods/FreeTerraForged"
loader = "neoforge"
seed = 3216933670
rtf_fixture = "../../../../../../games/minecraft/investigations/reterraforged/fixtures/vanilla-depth-maximum-ocean/fixture.toml"
retention = "discard"

[server_properties]
view-distance = 4
simulation-distance = 4
max-tick-time = -1

[timeouts]
startup = 360
step = 600
shutdown = 60

[expectations]
required_mods = ["minecraft", "reterraforged"]

[[probes]]
id = "squinch:finished-chunks"
version = "1"
config = { max_wait_ticks = 1200 }

[[steps]]
id = "confirm-datapack"
type = "command"
command = "datapack list enabled"
expect = { response_contains = "file/vanilla-depth-maximum-ocean.zip" }

[[steps]]
id = "generate-two-tiles"
type = "generate"
unit = "chunk"
bounds = [64, 64, 80, 64]
authority = "finished-chunk"
terminal_probe = "squinch:finished-chunks"
expect = { region_count = 2 }

[[steps]]
id = "flush-generated-chunks"
type = "command"
command = "save-all flush"
expect = { response_contains = "Saved the game" }
