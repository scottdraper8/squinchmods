default_install_hook_types: [pre-commit, pre-push]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=5120']
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: mixed-line-ending
        args: ['--fix=lf']
    -   id: check-yaml
        exclude: ^site/pnpm-lock\.yaml$
    -   id: check-toml
    -   id: check-json
        exclude: ^site/tsconfig\.json$
    -   id: check-ast
        files: \.py$
    -   id: debug-statements
        files: \.py$
    -   id: check-executables-have-shebangs
    -   id: check-shebang-scripts-are-executable

-   repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
    -   id: codespell
        files: \.md$
        args: ['-L', 'ore']
        additional_dependencies: [tomli]

-   repo: local
    hooks:
    -   id: tracked-artifact-boundary
        name: reject tracked runtime and investigation artifacts
        entry: tooling/check-tracked-artifacts
        language: system
        pass_filenames: false
        always_run: true
    -   id: prettier
        name: prettier (markdown, SCSS, and site config)
        entry: prettier --write
        language: node
        additional_dependencies:
        - prettier@3.9.9
        files: (\.md$|^site/.*\.(scss|json|jsonc|yaml)$)
        exclude: ^site/pnpm-lock\.yaml$
    -   id: site-static-analysis
        name: site Biome and TypeScript checks
        entry: tooling/site-static-analysis
        language: system
        pass_filenames: false
        files: ^site/(.*\.(ts|tsx)|biome\.json|tsr\.config\.json|tsconfig\.json|package\.json|pnpm-lock\.yaml)$
-   repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # frozen: v0.23.3
    hooks:
    -   id: markdownlint-cli2
        name: markdownlint-cli2 (markdown)
        args: ['--config', '.markdownlint-cli2.yaml']
        files: \.md$

-   repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
    -   id: gitleaks
        args: ['--config=.gitleaks.toml']

-   repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
    -   id: actionlint

# Shell scripts under games/minecraft/tooling/ (includes extensionless
# scripts like build-mod and mc-source, not just *.sh)
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
    -   id: shellcheck
        args: ['--severity=warning']
        files: ^games/minecraft/tooling/(.*\.sh|build-mod|mc-source)$

-   repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
    -   id: shfmt
        files: ^games/minecraft/tooling/(.*\.sh|build-mod|mc-source)$

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
    -   id: ruff-check
        types_or: [python, pyi]
        args: ['--fix']
    -   id: ruff-format
        types_or: [python, pyi]

# Centralized Minecraft check config schema validation.
-   repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
    hooks:
    -   id: check-jsonschema
        name: validate parent .squinch config
        files: ^\.squinch/config\.yml$
        args: ['--schemafile', '.squinch/schema/global-config.schema.json']
    -   id: check-jsonschema
        name: validate mod-level .squinch configs
        files: ^\.squinch/games/minecraft/mods/[^/]+/config\.yml$
        args: ['--schemafile', '.squinch/schema/mod-config.schema.json']
