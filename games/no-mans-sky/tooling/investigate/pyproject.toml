[project]
name = "squinch-nms-investigate"
version = "0.1.0"
description = "Reproducible No Man's Sky asset and mod investigation tooling"
requires-python = ">=3.11"
dependencies = ["hgpaktool==1.1.3", "jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squinch_nms_investigate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
