[project]
name = "squinch-nms-third-party"
version = "0.1.0"
description = "Reproducible No Man's Sky Nexus Mods acquisition and inspection tooling"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squinch_nms_third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
