[project]
name = "squinch-minecraft-third-party"
version = "0.1.0"
description = "Reproducible Minecraft third-party source and Modrinth acquisition tooling"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squinch_minecraft_third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
