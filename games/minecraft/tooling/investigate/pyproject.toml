[project]
name = "squinch-minecraft-investigate"
version = "0.1.0"
description = "Agent-facing Minecraft development investigation tooling"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squinch_minecraft_investigate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks subprocess and socket boundary tests",
]
