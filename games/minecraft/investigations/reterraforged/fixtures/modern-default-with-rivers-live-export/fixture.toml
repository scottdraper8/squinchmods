games/minecraft/investigation-state/runs/20260904T234748Z-8b0224b2a5, using RTF's own live default
Preset (Presets.modernDefaultWithRivers()). The client-world-lifecycle probe also confirmed the
resulting world reaches a real loaded overworld (status: pass in that run's
results/client-world-result.json), so this datapack is proven loadable, not just exportable.
"""
