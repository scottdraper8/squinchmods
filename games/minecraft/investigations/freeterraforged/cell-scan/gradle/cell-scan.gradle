import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def harnessProperty = gradle.startParameter.projectProperties.get("squinchCellScanHarness")
def requestProperty = gradle.startParameter.projectProperties.get("squinchCellScanRequest")
def resultProperty = gradle.startParameter.projectProperties.get("squinchCellScanResult")
def presetInputProperty = gradle.startParameter.projectProperties.get("squinchPresetInput")
def canonicalPresetOutputProperty = gradle.startParameter.projectProperties.get("squinchCanonicalPresetOutput")
def generatedDatapackOutputProperty = gradle.startParameter.projectProperties.get("squinchGeneratedDatapackOutput")
def buildRootProperty = gradle.startParameter.projectProperties.get("squinchBuildRoot")

def scanMode = requestProperty != null && resultProperty != null
def presetExportMode = presetInputProperty != null && canonicalPresetOutputProperty != null && generatedDatapackOutputProperty != null
if (harnessProperty == null || scanMode == presetExportMode) {
    throw new GradleException(
        "FTF standalone overlay requires its harness and exactly one complete operation input pair"
    )
}

def harnessRoot = new File(harnessProperty).canonicalFile
def sourceRoot = new File(harnessRoot, "src/main/java")
if (!sourceRoot.isDirectory()) {
    throw new GradleException("invalid Squinch cell scan harness: ${harnessRoot}")
}

gradle.beforeProject { project ->
    if (buildRootProperty != null) {
        def buildKey = project.path == ":" ? "root" : project.path.substring(1).replace(':', '/')
        project.layout.buildDirectory.set(
                new File(buildRootProperty, buildKey).canonicalFile)
    }
    if (project.path != ":fabric") {
        return
    }
    project.pluginManager.withPlugin("java") {
        project.sourceSets.main.java.srcDir(sourceRoot)
        if (scanMode) {
            project.tasks.register("squinchCellScan", JavaExec) { task ->
                task.group = "squinch investigation"
                task.description = "Run the external standalone FTF cell scanner"
                task.dependsOn(project.tasks.named("classes"))
                task.inputs.dir(sourceRoot)
                task.inputs.file(new File(requestProperty))
                task.outputs.file(new File(resultProperty))
                task.mainClass.set("org.squinchmods.investigate.ftf.CellScanMain")
                task.classpath = project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
                task.args(new File(requestProperty).canonicalPath, new File(resultProperty).canonicalPath)
                task.systemProperty("java.awt.headless", "true")
            }
        }
        if (presetExportMode) {
            // Preset export uses its own entrypoint and does not depend on the
            // cell scanner's version-specific terrain APIs.
            project.sourceSets.main.java.exclude("org/squinchmods/investigate/ftf/CellScanMain.java")
            project.sourceSets.main.java.exclude("org/squinchmods/investigate/ftf/CellFields.java")
            project.sourceSets.main.java.exclude("org/squinchmods/investigate/ftf/ScanAccumulator.java")
            project.sourceSets.main.java.exclude("etcodehome/freeterraforged/platform/RegistryUtil.java")
            project.tasks.named("processResources").configure { task ->
                task.inputs.property("squinchPresetExportEntrypoint", "1")
                task.doLast {
                    def metadata = new File(task.destinationDir, "fabric.mod.json")
                    def parsed = new JsonSlurper().parse(metadata)
                    parsed.entrypoints["fabric-datagen"].add(
                        "org.squinchmods.investigate.ftf.PresetExportMain"
                    )
                    metadata.text = JsonOutput.prettyPrint(JsonOutput.toJson(parsed))
                }
            }
            project.loom.runs.create("squinchPresetExport") { run ->
                run.inherit(project.loom.runs.getByName("client"))
                run.runDir = project.relativePath(
                    new File(generatedDatapackOutputProperty).parentFile.canonicalFile
                )
                run.vmArg("-Dfabric-api.datagen")
                run.vmArg("-Dfabric-api.datagen.modid=freeterraforged")
                run.vmArg("-Dfabric-api.datagen.output-dir=${generatedDatapackOutputProperty}-loader")
                run.vmArg("-Dsquinch.preset.input=${new File(presetInputProperty).canonicalPath}")
                run.vmArg("-Dsquinch.preset.canonical=${new File(canonicalPresetOutputProperty).canonicalPath}")
                run.vmArg("-Dsquinch.generated-datapack=${new File(generatedDatapackOutputProperty).canonicalPath}")
            }
            project.tasks.register("squinchPresetExport") { task ->
                task.group = "squinch investigation"
                task.description = "Generate a complete preset-derived FTF datapack"
                task.dependsOn("runSquinchPresetExport")
            }
        }
    }
}
